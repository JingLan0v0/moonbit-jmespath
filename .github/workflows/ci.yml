name: Verify MoonJMES

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Read MoonBit version
        id: toolchain
        shell: bash
        run: echo "version=$(node -p "require('./toolchain.json').moonbit_install_version")" >> "$GITHUB_OUTPUT"
      - name: Install pinned MoonBit on Linux
        if: runner.os == 'Linux'
        uses: hustcer/setup-moonbit@v1.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '${{ steps.toolchain.outputs.version }}'
          core-version: '${{ steps.toolchain.outputs.version }}'
      - name: Install pinned MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-moonbit-ci.ps1
      - name: Run full verification
        # Regression: full verification must select its own debug/release builds.
        env:
          JMES_CLI_PATH: ignored-external-cli.js
        run: node scripts/verify.mjs
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            _build/moon-version.txt
            _build/*-summary.json
            _build/equality-*-failure.json
            _build/composition-*-failure.json
            _build/*-minimized.json
          retention-days: 30
