name: Verify MoonJMES

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install pinned MoonBit on Linux
        if: runner.os == 'Linux'
        uses: hustcer/setup-moonbit@v1.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Install pinned MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-moonbit-ci.ps1
      - name: Record environment
        run: moon version --all
      - name: Verify project
        run: node scripts/verify.mjs
      - name: Run official JMESPath compliance suite
        run: node scripts/conformance.mjs
      - name: Check generated interfaces
        run: git diff --exit-code -- '*.mbti'
